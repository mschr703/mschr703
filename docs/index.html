<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Maxim's GitHub contribution graph with a small game.">
  <title>Contributions · Maxim</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="page">
    <a class="back-link" href="https://github.com/mschr703">Maxim on GitHub</a>
    <div class="layout">
      <section class="activity" aria-labelledby="summary">
        <h1 id="summary">Contributions</h1>
        <div class="calendar-card">
          <div class="calendar-scroll">
            <div class="month-labels" id="months" aria-hidden="true"></div>
            <div class="graph-body">
              <div class="weekday-labels" aria-hidden="true">
                <span>Mon</span><span>Wed</span><span>Fri</span>
              </div>
              <div class="grid-stage" id="stage">
                <div class="grid" id="grid" aria-label="Contribution calendar"></div>
                <svg class="ship" id="ship" width="24" height="20" viewBox="0 0 24 20" aria-hidden="true">
                  <path d="M21 10 5 2l3 8-3 8z" fill="#58a6ff" stroke="#c9d1d9" stroke-width="1"/>
                  <path d="M12 10 3 6v8z" fill="#c9d1d9"/>
                  <path d="M4 10 0 8v4z" fill="#e3b341"/>
                  <circle cx="13" cy="10" r="1.6" fill="#0d1117"/>
                </svg>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <div class="controls" aria-label="Game controls">
              <button id="play" type="button">Pause</button>
              <button id="reset" type="button">Reset</button>
            </div>
            <div class="legend" aria-hidden="true">
              <span>Less</span>
              <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i>
              <span>More</span>
            </div>
          </div>
        </div>
      </section>
      <nav class="years" id="years" aria-label="Contribution year"></nav>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  </main>
</body>
</html>
