name: Update contribution game

on:
  push:
    paths:
      - .github/workflows/contribution-game.yml
      - scripts/render_contribution_game.py
      - scripts/export_contributions.py
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-game
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python -m pip install Pillow==13.0.0
      - name: Generate animation from contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_contribution_game.py --username mschr703 --output contribution-game.gif
      - name: Export yearly calendars
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/export_contributions.py
      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-game.gif docs/contributions.json
          if git diff --cached --quiet; then
            echo "Animation unchanged"
            exit 0
          fi
          git commit -m "Update contribution game"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
