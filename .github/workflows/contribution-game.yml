name: Update contribution game

on:
  push:
    paths:
      - .github/workflows/contribution-game.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-game
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install game generator
        run: python -m pip install gh-space-shooter==2.0.5
      - name: Generate animation from contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh-space-shooter mschr703 --output contribution-game.gif --strategy column --fps 25
      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-game.gif
          if git diff --cached --quiet; then
            echo "Animation unchanged"
            exit 0
          fi
          git commit -m "Update contribution game"
          git push origin HEAD:main
